<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Groups</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>Study Group Hub</h1>
                <p>Browse Study Groups</p>
            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </header>


        <section class="welcome-section">

            <h2>Available Study Groups</h2>

            <p>
                Find and join study groups based on your subjects.
            </p>

        </section>


        <section class="action-section">

            <div class="action-grid">

                <div class="action-card">

                    <div class="icon">💻</div>

                    <h3>Python Programming</h3>

                    <p>
                        Practice Python programming with other students.
                    </p>

                    <p>
                        <strong>Members:</strong> 8
                    </p>

                    <p>
                        <strong>Subject:</strong> Programming
                    </p>
